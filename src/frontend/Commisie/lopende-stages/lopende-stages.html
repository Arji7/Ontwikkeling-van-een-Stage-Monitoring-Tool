<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lopende stages – StageMonitor</title>
  <link rel="stylesheet" href="lopende-stages.css" />
</head>
<body>
  <div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">StageMonitor</div>
      <div class="sidebar-subbrand">Erasmushogeschool Brussel</div>
      <nav class="sidebar-nav">
        <a href="../aanvragen.overzicht/aanvragen.overzicht.html" class="nav-item">Aanvragen</a>
        <a href="./lopende-stages.html" class="nav-item active">Lopende stages</a>
        <a href="#" class="nav-item">Evaluaties</a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar" id="sidebarUserAvatar">??</div>
          <div class="user-info">
            <span class="user-name" id="sidebarUserName">...</span>
            <span class="user-role">Stagecommissie</span>
          </div>
        </div>
        <a href="../../inloggen/inloggen.html" class="sidebar-logout"
           onclick="sessionStorage.removeItem('currentUser'); sessionStorage.removeItem('token');">
          🔓 Uitloggen
        </a>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <header class="page-header">
        <h1>Lopende stages</h1>
        <p>Overzicht van alle actieve stages dit academiejaar</p>
      </header>

      <section class="controls">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="🔍 Zoek student, bedrijf of docent…" />
        </div>
      </section>

      <div id="statsRow" class="stats-row"></div>

      <section class="students-grid">
        <div id="stagesContainer" class="grid"></div>
      </section>

      <div id="loadingSpinner" class="loading">
        <div class="spinner"></div>
        <p>Stages laden…</p>
      </div>

      <div id="errorMessage" class="error-message"></div>
    </main>
  </div>

  <script src="../../config.js"></script>
  <script src="lopende-stages.js"></script>
  <script>
    (function () {
      var u = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
      var name = u.name || 'Commissielid';
      var nEl = document.getElementById('sidebarUserName');
      var aEl = document.getElementById('sidebarUserAvatar');
      if (nEl) nEl.textContent = name;
      if (aEl) aEl.textContent = name.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
    })();
  </script>
</body>
</html>
