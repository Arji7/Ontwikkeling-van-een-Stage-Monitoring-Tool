<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aanvragen Overzicht - Stagecommissie</title>
    <link rel="stylesheet" href="aanvragen.overzicht.css">
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">StageMonitor</div>
      <div class="sidebar-subbrand">Erasmushogeschool Brussel</div>
      <nav class="sidebar-nav">
        <a href="./aanvragen.overzicht.html" class="nav-item active">Aanvragen</a>
        <a href="#" class="nav-item">Lopende stages</a>
        <a href="#" class="nav-item">Evaluaties</a>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar" id="sidebarUserAvatar">??</div>
          <div class="user-info">
            <span class="user-name" id="sidebarUserName">...</span>
            <span class="user-role">Stagecommissie</span>
          </div>
        </div>
        <a href="../../inloggen/inloggen.html" class="sidebar-logout" onclick="localStorage.removeItem('currentUser'); localStorage.removeItem('token');">🔓 Uitloggen</a>
      </div>
    </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- HEADER -->
            <header class="page-header">
                <h1>Stageaanvragen</h1>
                <p>Beheer en beoordeel alle inkomende stageaanvragen</p>
            </header>

            <!-- FILTERS & ZOEK -->
            <section class="controls">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="🔍 Zoek student of bedrijf..."
                    >
                </div>

                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="alle">
                        Alle
                    </button>
                    <button class="filter-btn" data-filter="ingediend">
                        In afwachting
                    </button>
                    <button class="filter-btn" data-filter="goedgekeurd">
                        Goedgekeurd
                    </button>
                    <button class="filter-btn" data-filter="afgekeurd">
                        Afgewezen
                    </button>
                </div>
            </section>

            <!-- STUDENTS GRID -->
            <section class="students-grid">
                <div id="studentsContainer" class="grid">
                    <!-- Students worden hier ingeladen via JS -->
                </div>
            </section>

            <!-- LOADING & ERROR STATES -->
            <div id="loadingSpinner" class="loading">
                <div class="spinner"></div>
                <p>Studenten laden...</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
        </main>
    </div>

    <script src="aanvragen.overzicht.js"></script>
    <script>
      (function () {
        var u = JSON.parse(localStorage.getItem("currentUser") || "{}");
        var name = u.name || "Commissielid";
        var nEl = document.getElementById("sidebarUserName");
        var aEl = document.getElementById("sidebarUserAvatar");
        if (nEl) nEl.textContent = name;
        if (aEl) aEl.textContent = name.split(" ").map(function (w) { return w[0]; }).join("").slice(0, 2).toUpperCase();
      })();
    </script>
</body>
</html>
