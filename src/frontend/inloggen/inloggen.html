<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StageMonitorage — Inloggen</title>
  <link rel="stylesheet" href="inloggen.css" />
</head>

<body>
  <main class="login-card">

    <header class="login-header">
      <h1 class="login-title">StageMonitorage</h1>
      <p class="login-subtitle">Inloggen als begeleidende docent</p>
    </header>

    <div id="formAlert" class="form-alert" role="alert"></div>

    <form id="loginForm" novalidate>

      <div class="form-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" class="input"
               autocomplete="username" placeholder="naam@ehb.be" />
        <p id="emailError" class="field-error"></p>
      </div>

      <div class="form-field">
        <label for="password">Wachtwoord</label>
        <input type="password" id="password" class="input"
               autocomplete="current-password" placeholder="••••••••" />
        <p id="passwordError" class="field-error"></p>
      </div>

      <div class="login-options">
        <label class="remember-me">
          <input type="checkbox" id="remember" />
          Onthoud mij
        </label>
        <a href="#" class="forgot-link">Wachtwoord vergeten?</a>
      </div>

      <button type="submit" id="loginButton" class="btn">Inloggen</button>
    </form>
  </main>

  <script src="inloggen.js"></script>
</body>
</html>
