<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lopende stages – Stagecommissie | StageMonitor</title>
  <link rel="stylesheet" href="lopende-stages.css" />
</head>
<body>
  <div class="app">

    <!-- ===== ZIJBALK ===== -->
    <aside class="sidebar">
      <div class="sidebar-brand">StageMonitor</div>
      <div class="sidebar-subbrand">Erasmushogeschool Brussel</div>
      <nav class="sidebar-nav">
        <a href="../aanvragen.overzicht/aanvragen.overzicht.html" class="nav-item">Aanvragen</a>
        <a href="./lopende-stages.html" class="nav-item active">Lopende stages</a>
        <a href="#" class="nav-item">Evaluaties</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar" id="sidebarUserAvatar">??</div>
          <div class="user-info">
            <span class="user-name" id="sidebarUserName">...</span>
            <span class="user-role">Stagecommissie</span>
          </div>
        </div>
        <a href="../../inloggen/inloggen.html" class="sidebar-logout" onclick="sessionStorage.removeItem('currentUser'); sessionStorage.removeItem('token');">🔓 Uitloggen</a>
      </div>
    </aside>

    <!-- ===== HOOFDINHOUD ===== -->
    <main class="content">
      <div class="page-header">
        <h1 class="page-title">Lopende stages</h1>
        <p class="page-sub">Overzicht van alle actieve stages</p>
      </div>

      <!-- Zoekbalk -->
      <div class="search-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Zoek student, bedrijf of mentor…" />
      </div>

      <!-- Statistieken -->
      <div class="stats-row" id="statsRow">
        <div class="stat-card">
          <span class="stat-number" id="statTotaal">—</span>
          <span class="stat-label">Actieve stages</span>
        </div>
      </div>

      <!-- Grid -->
      <div id="loadingSpinner" class="loading">
        <div class="spinner"></div>
        <p>Stages laden…</p>
      </div>
      <div id="errorMessage" class="error-message"></div>
      <div id="stagesGrid" class="stages-grid" style="display:none;"></div>
    </main>
  </div>

  <script src="../../config.js"></script>
  <script src="lopende-stages.js"></script>
  <script>
    (function () {
      var u = JSON.parse(sessionStorage.getItem("currentUser") || "{}");
      var name = u.name || "Commissielid";
      var nEl = document.getElementById("sidebarUserName");
      var aEl = document.getElementById("sidebarUserAvatar");
      if (nEl) nEl.textContent = name;
      if (aEl) aEl.textContent = name.split(" ").map(function (w) { return w[0]; }).join("").slice(0, 2).toUpperCase();
    })();
  </script>
</body>
</html>
