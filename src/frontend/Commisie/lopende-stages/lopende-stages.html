<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lopende Stages - Stagecommissie</title>
  <link rel="stylesheet" href="../aanvragen.overzicht/aanvragen.overzicht.css">
  <link rel="stylesheet" href="lopende-stages.css">
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-brand">StageMonitor</div>
      <div class="sidebar-subbrand">Erasmushogeschool Brussel</div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar" id="sidebarUserAvatar">??</div>
          <div class="user-info">
            <span class="user-name" id="sidebarUserName">...</span>
            <span class="user-role">Stagecommissie</span>
          </div>
        </div>
        <a href="../../inloggen/inloggen.html" class="sidebar-logout"
           onclick="sessionStorage.removeItem('currentUser'); sessionStorage.removeItem('token');">🔓 Uitloggen</a>
      </div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <h1>Lopende Stages</h1>
        <p>Overzicht van de aanvragen dit academiejaar</p>
      </header>

      <section class="controls">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="🔍 Zoek stagiair of bedrijf...">
        </div>
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="alle">Alle <span id="cnt-alle"></span></button>
          <button class="filter-btn" data-filter="actief">Actief <span id="cnt-actief"></span></button>
          <button class="filter-btn" data-filter="afgerond">Afgerond <span id="cnt-afgerond"></span></button>
        </div>
      </section>

      <section class="table-section">
        <div id="tableContainer"></div>
      </section>
    </main>
  </div>

  <script src="../../config.js"></script>
  <script>window.SIDEBAR_PAGE = 'commissie-lopende-stages'; window.FRONTEND_ROOT = '../../';</script>
  <script src="../../sidebar-builder.js"></script>
  <script src="lopende-stages.js"></script>
  <script>
    (function () {
      var u = JSON.parse(sessionStorage.getItem("currentUser") || "{}");
      var name = u.name || "Commissielid";
      var nEl = document.getElementById("sidebarUserName");
      var aEl = document.getElementById("sidebarUserAvatar");
      if (nEl) nEl.textContent = name;
      if (aEl) aEl.textContent = name.split(" ").map(function (w) { return w[0]; }).join("").slice(0, 2).toUpperCase();
    })();
  </script>
</body>
</html>
