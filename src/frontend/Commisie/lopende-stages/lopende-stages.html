<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lopende stages – StageMonitor</title>
  <link rel="stylesheet" href="lopende-stages.css" />
</head>
<body>
  <div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-brand">StageMonitor</div>
      <div class="sidebar-subbrand">Erasmushogeschool Brussel</div>
      <nav class="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <div class="sidebar-role-label">
          Actieve rollen:<br />
          <strong id="sidebarRoles">—</strong>
        </div>
        <div class="sidebar-user">
          <div class="user-avatar" id="sidebarUserAvatar">??</div>
          <div class="user-info">
            <span class="user-name" id="sidebarUserName">...</span>
            <span class="user-role" id="sidebarUserRole">Stagecommissie</span>
          </div>
        </div>
        <a href="../../inloggen/inloggen.html" class="sidebar-logout"
           onclick="sessionStorage.removeItem('currentUser'); sessionStorage.removeItem('token');">
          🔓 Uitloggen
        </a>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <header class="page-header">
        <h1>Lopende stages</h1>
        <p>Overzicht van alle actieve stages dit academiejaar</p>
      </header>

      <section class="controls">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="🔍 Zoek student, bedrijf of docent…" />
        </div>
      </section>

      <div id="statsRow" class="stats-row"></div>

      <section class="students-grid">
        <div id="stagesContainer" class="grid"></div>
      </section>

      <div id="loadingSpinner" class="loading">
        <div class="spinner"></div>
        <p>Stages laden…</p>
      </div>

      <div id="errorMessage" class="error-message"></div>
    </main>
  </div>

  <script src="../../config.js"></script>
  <script>window.SIDEBAR_PAGE = 'lopende-stages'; window.FRONTEND_ROOT = '../../';</script>
  <script src="../../Admin/sidebar-builder.js"></script>
  <script src="lopende-stages.js"></script>
</body>
</html>
