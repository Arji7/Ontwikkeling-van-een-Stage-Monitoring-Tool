<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aanvragen Overzicht - Stagecommissie</title>
    <link rel="stylesheet" href="aanvragen.overzicht.css">
    <li>
</li>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Stagecommissie</h2>
                <button class="sidebar-toggle">☰</button>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="./aanvragen.overzicht.html" class="active">
                            📋 Aanvragen
                        </a>
                    </li>
                    <li>
                        <a href="#">🔄 Lopende Stages</a>
                    </li>
                    <li>
                        <a href="#">⭐ Evaluaties</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- HEADER -->
            <header class="page-header">
                <h1>Stageaanvragen</h1>
                <p>Beheer en beoordeel alle inkomende stageaanvragen</p>
            </header>

            <!-- FILTERS & ZOEK -->
            <section class="controls">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="🔍 Zoek student of bedrijf..."
                    >
                </div>

                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="alle">
                        Alle
                    </button>
                    <button class="filter-btn" data-filter="in-afwachting">
                        In afwachting
                    </button>
                    <button class="filter-btn" data-filter="goedgekeurd">
                        Goedgekeurd
                    </button>
                    <button class="filter-btn" data-filter="afgewezen">
                        Afgewezen
                    </button>
                </div>
            </section>

            <!-- STUDENTS GRID -->
            <section class="students-grid">
                <div id="studentsContainer" class="grid">
                    <!-- Students worden hier ingeladen via JS -->
                </div>
            </section>

            <!-- LOADING & ERROR STATES -->
            <div id="loadingSpinner" class="loading">
                <div class="spinner"></div>
                <p>Studenten laden...</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
        </main>
    </div>

    <script src="aanvragen.overzicht.js"></script>
</body>
</html>
